  <rect x="30" y="620" width="14" height="14" fill="#45475a" rx="2"/>
  <text x="52" y="632" fill="#cdd6f4">Linha de identificação do schema (any.type = schema)</text>
  <rect x="30" y="644" width="14" height="14" fill="#313244" rx="2"/>
  <text x="52" y="656" fill="#cdd6f4">Linhas padrão de log (bradesco.*, schema.*, attributes) — NÃO alterar</text>
