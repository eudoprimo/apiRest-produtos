  <text x="52" y="584" fill="#cdd6f4">Linha <tspan font-weight="bold">0 body</tspan> — âncora de inserção (NÃO alterar)</text>
  <rect x="30" y="596" width="14" height="14" fill="#313244" stroke="#a6e3a1" stroke-width="2" stroke-dasharray="4,2" rx="2"/>
