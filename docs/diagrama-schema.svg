<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" font-family="Consolas, 'Courier New', monospace">

  <!-- Background -->
  <rect width="900" height="720" fill="#f8f9fa" rx="8"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">
    Guia Visual: Aba Schema — Template Excel de Rastreabilidade
  </text>
  <text x="450" y="58" text-anchor="middle" font-size="12" fill="#555">
    Como localizar o bloco correto e inserir os campos da transação cripto
  </text>

  <!-- ─── LEGEND ─── -->
  <rect x="20" y="72" width="860" height="36" fill="#ffffff" stroke="#ccc" rx="4"/>
  <rect x="30" y="82" width="14" height="14" fill="#fff3cd" stroke="#ffc107"/>
  <text x="50" y="93" font-size="11" fill="#333">Cabeçalho (não alterar)</text>
  <rect x="160" y="82" width="14" height="14" fill="#e8d5f5" stroke="#9b59b6"/>
  <text x="180" y="93" font-size="11" fill="#333">Linhas bradesco.* / schema.* (configuração)</text>
  <rect x="390" y="82" width="14" height="14" fill="#d4edda" stroke="#28a745"/>
  <text x="410" y="93" font-size="11" fill="#333">0 body (objeto raiz — ponto de referência)</text>
  <rect x="610" y="82" width="14" height="14" fill="#cce5ff" stroke="#0d6efd"/>
  <text x="630" y="93" font-size="11" fill="#333">Novas linhas a inserir</text>
  <rect x="770" y="82" width="14" height="14" fill="#f8d7da" stroke="#dc3545"/>
  <text x="790" y="93" font-size="11" fill="#333">Campos existentes</text>

  <!-- ─── COLUMN HEADERS ─── -->
  <g font-size="10" font-weight="bold" fill="#555">
    <rect x="20" y="118" width="860" height="20" fill="#dee2e6" stroke="#adb5bd"/>
    <text x="30" y="132">level</text>
    <text x="80" y="132">any.title</text>
    <text x="200" y="132">any.description</text>
    <text x="380" y="132">any.type</text>
    <text x="460" y="132">---</text>
    <text x="500" y="132">object.required</text>
    <text x="610" y="132">brad.business.label</text>
    <text x="730" y="132">any.enum</text>
    <text x="820" y="132">any.const</text>
  </g>

  <!-- ─── ROW HELPER ─── -->
  <!-- y positions: 138, 158, 178, 198, 218, 238, 258, 278, 298, 318, 338, 358, ... -->

  <!-- Header rows (yellow) -->
  <rect x="20" y="138" width="860" height="20" fill="#fff3cd" stroke="#ffc107" stroke-width="0.5"/>
  <text x="30" y="152" font-size="10" fill="#7d5a00">— Linha de cabeçalho 1 (Obrigatório / Opcional…) — NÃO ALTERAR</text>

  <rect x="20" y="158" width="860" height="20" fill="#fff3cd" stroke="#ffc107" stroke-width="0.5"/>
  <text x="30" y="172" font-size="10" fill="#7d5a00">— Linha de cabeçalho 2 (Nível / Nome / …) — NÃO ALTERAR</text>

  <rect x="20" y="178" width="860" height="20" fill="#fff3cd" stroke="#ffc107" stroke-width="0.5"/>
  <text x="30" y="192" font-size="10" fill="#7d5a00">— Linha de cabeçalho 3 (level / any.title / …) — NÃO ALTERAR</text>

  <!-- schema.* / bradesco.* lines (purple) -->
  <rect x="20" y="198" width="860" height="20" fill="#e8d5f5" stroke="#9b59b6" stroke-width="0.5"/>
  <text x="30" y="212" font-size="10" fill="#5b2c6f">bradesco.rastreabilidade  ← CONFIGURAÇÃO (não é campo do LOG)</text>

  <rect x="20" y="218" width="860" height="20" fill="#e8d5f5" stroke="#9b59b6" stroke-width="0.5"/>
  <text x="30" y="232" font-size="10" fill="#5b2c6f">schema.contabil           ← CONFIGURAÇÃO</text>

  <rect x="20" y="238" width="860" height="20" fill="#e8d5f5" stroke="#9b59b6" stroke-width="0.5"/>
  <text x="30" y="252" font-size="10" fill="#5b2c6f">schema.produto            ← CONFIGURAÇÃO</text>

  <rect x="20" y="258" width="860" height="20" fill="#e8d5f5" stroke="#9b59b6" stroke-width="0.5"/>
  <text x="30" y="272" font-size="10" fill="#5b2c6f">schema.type = schema      ← localiza início do bloco de schema</text>

  <rect x="20" y="278" width="860" height="20" fill="#e8d5f5" stroke="#9b59b6" stroke-width="0.5"/>
  <text x="30" y="292" font-size="10" fill="#5b2c6f">schema.sistemico          ← CONFIGURAÇÃO</text>

  <rect x="20" y="298" width="860" height="20" fill="#e8d5f5" stroke="#9b59b6" stroke-width="0.5"/>
  <text x="30" y="312" font-size="10" fill="#5b2c6f">schema.classificacao      ← CONFIGURAÇÃO</text>

  <!-- 0 body row (green — anchor point) -->
  <rect x="20" y="318" width="860" height="22" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="30" y="333" font-size="11" font-weight="bold" fill="#155724">0</text>
  <text x="80" y="333" font-size="11" font-weight="bold" fill="#155724">body</text>
  <text x="200" y="333" font-size="11" fill="#155724">Corpo do evento de log</text>
  <text x="380" y="333" font-size="11" fill="#155724">object</text>
  <text x="460" y="333" font-size="11" fill="#155724">false</text>
  <text x="500" y="333" font-size="11" fill="#155724">true</text>
  <!-- Arrow indicator -->
  <text x="820" y="333" font-size="11" font-weight="bold" fill="#155724">◄ REFERÊNCIA</text>

  <!-- ── INSERTION ZONE ── -->
  <!-- Dashed insertion area -->
  <rect x="20" y="340" width="860" height="164" fill="#e8f4fd" stroke="#0d6efd" stroke-width="2" stroke-dasharray="6,3" rx="2"/>
  <text x="450" y="358" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d6efd">▼  INSERIR AQUI: 12 novas linhas (1 objeto + 11 campos)  ▼</text>

  <!-- New lines (blue) -->
  <rect x="26" y="362" width="848" height="19" fill="#cce5ff" stroke="#0d6efd" stroke-width="0.5"/>
  <text x="36" y="375" font-size="10" font-weight="bold" fill="#004085">1</text>
  <text x="86" y="375" font-size="10" font-weight="bold" fill="#004085">transacao</text>
  <text x="206" y="375" font-size="10" fill="#004085">Dados da transação cripto</text>
  <text x="386" y="375" font-size="10" fill="#004085">object</text>
  <text x="466" y="375" font-size="10" fill="#004085">false</text>
  <text x="506" y="375" font-size="10" fill="#004085">true</text>
  <text x="616" y="375" font-size="10" fill="#004085">transacao</text>

  <rect x="26" y="381" width="848" height="19" fill="#e3f0ff" stroke="#0d6efd" stroke-width="0.5"/>
  <text x="36" y="394" font-size="10" fill="#004085">2</text>
  <text x="86" y="394" font-size="10" fill="#004085">preco</text>
  <text x="206" y="394" font-size="10" fill="#004085">Valor da transação</text>
  <text x="386" y="394" font-size="10" fill="#004085">number</text>
  <text x="466" y="394" font-size="10" fill="#004085">false</text>
  <text x="506" y="394" font-size="10" fill="#004085">true</text>
  <text x="616" y="394" font-size="10" fill="#004085">preco</text>

  <rect x="26" y="400" width="848" height="19" fill="#cce5ff" stroke="#0d6efd" stroke-width="0.5"/>
  <text x="36" y="413" font-size="10" fill="#004085">2</text>
  <text x="86" y="413" font-size="10" fill="#004085">quantidade_de_moedas</text>
  <text x="386" y="413" font-size="10" fill="#004085">number</text>
  <text x="466" y="413" font-size="10" fill="#004085">false</text>
  <text x="506" y="413" font-size="10" fill="#004085">true</text>
  <text x="616" y="413" font-size="10" fill="#004085">quantidadeDeMoedas</text>

  <rect x="26" y="419" width="848" height="19" fill="#e3f0ff" stroke="#0d6efd" stroke-width="0.5"/>
  <text x="36" y="432" font-size="10" fill="#004085">2</text>
  <text x="86" y="432" font-size="10" fill="#004085">criacao_ordem</text>
  <text x="206" y="432" font-size="10" fill="#004085">Data/hora criação (ISO 8601)</text>
  <text x="386" y="432" font-size="10" fill="#004085">string</text>
  <text x="466" y="432" font-size="10" fill="#004085">false</text>
  <text x="506" y="432" font-size="10" fill="#004085">true</text>
  <text x="616" y="432" font-size="10" fill="#004085">criacaoOrdem</text>

  <rect x="26" y="438" width="848" height="19" fill="#cce5ff" stroke="#0d6efd" stroke-width="0.5"/>
  <text x="36" y="451" font-size="10" fill="#004085">2</text>
  <text x="86" y="451" font-size="10" fill="#004085">confirmacao_ordem</text>
  <text x="206" y="451" font-size="10" fill="#004085">Data/hora confirmação (ISO 8601)</text>
  <text x="386" y="451" font-size="10" fill="#004085">string</text>
  <text x="466" y="451" font-size="10" fill="#004085">false</text>
  <text x="506" y="451" font-size="10" fill="#004085">true</text>
  <text x="616" y="451" font-size="10" fill="#004085">confirmacaoOrdem</text>

  <rect x="26" y="457" width="848" height="19" fill="#e3f0ff" stroke="#0d6efd" stroke-width="0.5"/>
  <text x="36" y="470" font-size="10" fill="#004085">2</text>
  <text x="86" y="470" font-size="10" fill="#004085">tipo_transacao</text>
  <text x="206" y="470" font-size="10" fill="#004085">Tipo da transação</text>
  <text x="386" y="470" font-size="10" fill="#004085">string</text>
  <text x="466" y="470" font-size="10" fill="#004085">false</text>
  <text x="506" y="470" font-size="10" fill="#004085">true</text>
  <text x="616" y="470" font-size="10" fill="#004085">tipoTransacao</text>
  <text x="736" y="470" font-size="10" fill="#004085">debito|credito</text>

  <rect x="26" y="476" width="848" height="19" fill="#cce5ff" stroke="#0d6efd" stroke-width="0.5"/>
  <text x="36" y="489" font-size="10" fill="#004085">2</text>
  <text x="86" y="489" font-size="10" fill="#004085">id_usuario / tipo_ordem / tipo_ativo / id_ordem / status_ordem / status_safer</text>
  <text x="736" y="489" font-size="9" fill="#004085">(ver TSV completo)</text>

  <!-- End of insertion zone label -->
  <text x="450" y="512" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d6efd">▲  FIM DA INSERÇÃO  ▲</text>

  <!-- 1 codigoTransacao (existing - red) -->
  <rect x="20" y="516" width="860" height="20" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="30" y="530" font-size="11" font-weight="bold" fill="#721c24">1</text>
  <text x="80" y="530" font-size="11" font-weight="bold" fill="#721c24">codigoTransacao</text>
  <text x="200" y="530" font-size="11" fill="#721c24">Código da transação (existente)</text>
  <text x="380" y="530" font-size="11" fill="#721c24">string</text>
  <text x="820" y="530" font-size="11" font-weight="bold" fill="#721c24">◄ JÁ EXISTE</text>

  <rect x="20" y="536" width="860" height="20" fill="#f8d7da" stroke="#dc3545" stroke-width="0.5"/>
  <text x="30" y="550" font-size="10" fill="#721c24">1   mensagens   …   (campos existentes do log — não remover)</text>

  <rect x="20" y="556" width="860" height="20" fill="#f8d7da" stroke="#dc3545" stroke-width="0.5"/>
  <text x="30" y="570" font-size="10" fill="#721c24">1   retorno / resource / service.name / request …   (demais campos do log)</text>

  <!-- ─── STEP ANNOTATIONS ─── -->
  <!-- Arrow from "schema.type=schema" to "0 body" -->
  <line x1="870" y1="268" x2="890" y2="268" stroke="#9b59b6" stroke-width="1.5"/>
  <line x1="890" y1="268" x2="890" y2="329" stroke="#9b59b6" stroke-width="1.5"/>
  <line x1="870" y1="329" x2="890" y2="329" stroke="#9b59b6" stroke-width="1.5"/>

  <!-- STEPS BOX -->
  <rect x="20" y="590" width="860" height="118" fill="#ffffff" stroke="#6c757d" rx="6"/>
  <text x="36" y="610" font-size="12" font-weight="bold" fill="#1a1a2e">Passo a passo no Excel:</text>

  <text x="36" y="630" font-size="11" fill="#333">1)  Localize a linha</text>
  <rect x="138" y="619" width="12" height="12" fill="#e8d5f5" stroke="#9b59b6"/>
  <text x="154" y="630" font-size="11" fill="#333">schema.type = schema  →  ela marca o início do bloco correto.</text>

  <text x="36" y="648" font-size="11" fill="#333">2)  Desça até a linha</text>
  <rect x="148" y="637" width="12" height="12" fill="#d4edda" stroke="#28a745"/>
  <text x="164" y="648" font-size="11" fill="#333">0  body  (object)  →  este é o seu ponto de referência.</text>

  <text x="36" y="666" font-size="11" fill="#333">3)  Clique na linha</text>
  <rect x="136" y="655" width="12" height="12" fill="#f8d7da" stroke="#dc3545"/>
  <text x="152" y="666" font-size="11" fill="#333">1  codigoTransacao  →  insira 12 linhas ACIMA desta (Inserir linha).</text>

  <text x="36" y="684" font-size="11" fill="#333">4)  Copie a linha anterior (</text>
  <rect x="198" y="673" width="12" height="12" fill="#d4edda" stroke="#28a745"/>
  <text x="214" y="684" font-size="11" fill="#333">0 body) para todas as novas linhas — preserva fórmulas e validações.</text>

  <text x="36" y="702" font-size="11" fill="#333">5)  Nas 12 novas linhas, substitua os valores (level / any.title / any.type / object.required / any.enum / brad.business.label).</text>
</svg>
