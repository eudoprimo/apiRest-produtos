  <text x="30" y="944" fill="#cdd6f4" font-size="12">6. Rode <tspan font-weight="bold">Gerar JSON</tspan></text>

  <text x="30" y="968" fill="#f38ba8" font-size="12" font-weight="bold">Diferença entre STATUS e CONFIRMACAO:</text>
  <text x="30" y="986" fill="#cdd6f4" font-size="12">STATUS_RFQ_CL: schema.logado = "Não" | resource sem sub-campos de request/ticket/application/saida</text>
  <text x="30" y="1004" fill="#cdd6f4" font-size="12">CONFIRMACAO_RFQ_CL: schema.logado = "Sim" | resource tem request/ticket/application/saida</text>
