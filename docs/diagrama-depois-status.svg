  <text x="30" y="854" fill="#cdd6f4" font-size="12">1. Clique na linha do <tspan font-weight="bold">codigoTransacao</tspan></text>
  <text x="30" y="872" fill="#cdd6f4" font-size="12">2. Insira 12 linhas acima (Shift+Ctrl+↑ no Excel, ou clique direito → Inserir Linhas)</text>
  <text x="30" y="890" fill="#cdd6f4" font-size="12">3. Copie a linha do <tspan font-weight="bold">codigoTransacao</tspan> para cada nova linha (preserva fórmulas/validações)</text>
  <text x="30" y="908" fill="#cdd6f4" font-size="12">4. Substitua os valores nas colunas: <tspan fill="#cba6f7">level, any.title, any.description, any.type, object.required, brad.business.label, any.enum</tspan></text>
